version: '3.10.4'

services:
  # 1. FastAPI API 서버를 위한 서비스
  api-server:
    build: .  # 현재 디렉토리의 Dockerfile을 사용해 이미지를 빌드
    ports:
      - "8888:8888" # 호스트의 8888 포트와 컨테이너의 8888 포트를 연결
    restart: always # 컨테이너가 죽으면 항상 재시작

  # 2. 환율 크롤러 스케줄러를 위한 서비스
  currency-crawler:
    build: .
    # Dockerfile의 CMD를 무시하고 이 명령어를 실행
    command: ["python", "scripts/run_realtime_crawler.py"]
    restart: always

  # 3. AI 예측 스케줄러를 위한 서비스
  ai-predictor:
    build: .
    command: ["python", "scripts/run_ai_predictor.py"]
    restart: always